<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Income</title>
  <link rel="stylesheet" href="../css/style.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <nav class="navbar">
    <div><strong>Finance Tracker</strong></div>
    <div>
        <a href="..\index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="dashboard.html"><i class="fas fa-home"></i> Main page</a>
        <a href="expenses.html"><i class="fas fa-credit-card"></i> Expenses</a>
        <a href="income.html"><i class="fas fa-money-bill-wave"></i> Income</a>
        <a href="budget.html"><i class="fas fa-wallet"></i> Budget</a>
        <a href="savings.html"><i class="fas fa-piggy-bank"></i> Savings</a>
        <a href="debts.html"><i class="fas fa-hand-holding-usd"></i> Debts</a>
        <a href="reports.html"><i class="fas fa-chart-line"></i> Reports</a>
    </div>
  </nav>
  <button id="resetBtn" class="reset-button">
    <i class="fas fa-sync-alt"></i> Reset Data
  </button>
  

  <div class="container">
    <h1><i class="fas fa-money-bill-wave"></i> Income Tracker</h1>

    <div class="card">
      <h2><i class="fas fa-plus-circle"></i> Add Income</h2>
      <form id="incomeForm">
        <input type="text" id="incomeSource" placeholder="Source" required />
        <input type="number" id="incomeAmount" placeholder="Amount" required />
        <button type="submit"><i class="fas fa-plus"></i> Add Income</button>
      </form>
    </div>

    <div class="card">
      <h2><i class="fas fa-history"></i> Income History</h2>
      <ul id="incomeList"></ul>
    </div>
  </div>

  <!-- Load your income.js after elements exist -->
  <script src="../js/income.js"></script>
  <script src="../js/resetButton.js"></script>

</body>
</html>
