<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Financial Reports</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/reports.js"></script>
  <script src="../js/resetButton.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <nav class="navbar">
    <div><strong>Finance Tracker</strong></div>
    <div>
        <a href="..\index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="dashboard.html"><i class="fas fa-home"></i> Main page</a>
      <a href="expenses.html"><i class="fas fa-credit-card"></i> Expenses</a>
      <a href="income.html"><i class="fas fa-money-bill-wave"></i> Income</a>

      <a href="debts.html"><i class="fas fa-hand-holding-usd"></i> Debts</a>

  </nav>

  
  

  <div class="container">
    <h1><i class="fas fa-chart-line"></i> Financial Reports</h1>

    <div class="card">

      <canvas id="expensesChart" width="400" height="200"></canvas>
    </div>

    <div class="card">
      <h2><i class="fas fa-exchange-alt"></i> Income vs Expenses</h2>
      <canvas id="incomeVsExpensesChart" width="400" height="200"></canvas>

    </button>
