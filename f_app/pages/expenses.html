<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Expenses | Finance Tracker</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
  <nav class="navbar">
    <div><strong>Finance Tracker</strong></div>
    <div>
      <a href="../index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="dashboard.html"><i class="fas fa-home"></i> Main page</a>
      <a href="expenses.html"><i class="fas fa-credit-card"></i> Expenses</a>
      <a href="income.html"><i class="fas fa-money-bill-wave"></i> Income</a>
      <a href="budget.html"><i class="fas fa-wallet"></i> Budget</a>
      <a href="savings.html"><i class="fas fa-piggy-bank"></i> Savings</a>
      <a href="debts.html"><i class="fas fa-hand-holding-usd"></i> Debts</a>
      <a href="../pages/reports.html"><i class="fas fa-chart-pie"></i> Reports</a>
    </div>
  </nav>
  <button id="resetBtn" class="reset-button">
    <i class="fas fa-sync-alt"></i> Reset Data
  </button>
  
  <div class="container">
    <h1><i class="fas fa-credit-card"></i> Expense Tracker</h1>

    <div class="card">
      <h2><i class="fas fa-plus-circle"></i> Add New Expense</h2>
      <form id="expenseForm">
        <input type="text" id="expenseDescription" placeholder="Description" required />
        <input type="number" id="expenseAmount" placeholder="Amount" required />
        <select id="expenseCategory" required>
          <option disabled selected>Category</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Utilities</option>
          <option>Entertainment</option>
          <option>Other</option>
        </select>
        <button type="submit"><i class="fas fa-plus"></i> Add Expense</button>
      </form>
    </div>

    <div class="card">
      <h2><i class="fas fa-history"></i> Expense History</h2>
      <ul id="expenseList"></ul>
    </div>
  </div>

  <!-- Load JS after content -->
  <script src="../js/expenses.js"></script>
  <script src="../js/resetButton.js"></script>

</body>
</html>
