<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Tracker Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/main.js"></script>
  <script src="../js/resetButton.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

  <nav class="navbar">
    <div><strong>Finance Tracker</strong></div>
    <div>
      <a href="../index.html"><i class="fas fa-tachometer-alt"></i> Main Page</a>
      <a href="expenses.html"><i class="fas fa-credit-card"></i> Expenses</a>
      <a href="income.html"><i class="fas fa-money-bill-wave"></i> Income</a>
      <a href="budget.html"><i class="fas fa-wallet"></i> Budget</a>
      <a href="savings.html"><i class="fas fa-piggy-bank"></i> Savings</a>
      <a href="debts.html"><i class="fas fa-hand-holding-usd"></i> Debts</a>
      <a href="reports.html"><i class="fas fa-chart-pie"></i> Reports</a>
    </div>
  </nav>
  

  <div class="container">
    <h1><i class="fas fa-chart-line"></i> Dashboard</h1>

    <!-- Welcome Card -->
    <div class="card finance-card">
      <h2><i class="fas fa-hand-holding-usd"></i> 💰 Welcome to Your Finance !</h2>
      <img src="../assets/COIN.jpg" alt="Finance Image" class="finance-image">
      <p>Track your income, expenses, budgets, and savings all in one place!</p>
    </div>

    <!-- Quick Links Card -->
    <div class="card quick-links">
      <h3><i class="fas fa-link"></i> Quick Access 📊</h3>
      <a href="expenses.html"><i class="fas fa-credit-card"></i> Expenses</a>
      <a href="income.html"><i class="fas fa-money-bill-wave"></i> Income</a>
      <a href="budget.html"><i class="fas fa-wallet"></i> Budget</a>
      <a href="savings.html"><i class="fas fa-piggy-bank"></i> Savings</a>
      <a href="debts.html"><i class="fas fa-hand-holding-usd"></i> Debts</a>
      <a href="reports.html"><i class="fas fa-chart-pie"></i> Reports</a>
    </div>

    <!-- Add Expense Card -->
    <div class="card">
      <h2><i class="fas fa-plus-circle"></i> Add Expense</h2>
      <form id="expenseForm">
        <div class="form-group">
          <label for="expenseDescription"><i class="fas fa-edit"></i> Description</label>
          <input type="text" id="expenseDescription" placeholder="Description" required />
        </div>
        <div class="form-group">
          <label for="expenseAmount"><i class="fas fa-dollar-sign"></i> Amount</label>
          <input type="number" id="expenseAmount" placeholder="Amount" required />
        </div>
        <div class="form-group">
          <label for="expenseCategory"><i class="fas fa-list-alt"></i> Category</label>
          <select id="expenseCategory" required>
            <option value="" disabled selected>Choose a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit"><i class="fas fa-check-circle"></i> Add Expense</button>
      </form>
      <button id="resetBtn" class="reset-button">
        <i class="fas fa-sync-alt"></i> Reset Data
      </button>
      
    </div>

    <!-- Expense List Card -->
    <div class="card">
      <h2><i class="fas fa-list-ul"></i> Recent Expenses</h2>
      <ul id="expenseList"></ul>
    </div>

  </div>

</body>
</html>
